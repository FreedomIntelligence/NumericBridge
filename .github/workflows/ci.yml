name: Validate skill
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repository-validation:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            community/requirements-mcp.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -B -m scripts validate
      - run: python -B -m unittest scripts.test_case_delivery_state scripts.test_upstream_status scripts.test_strict_pr
      - if: matrix.python == '3.12'
        run: |
          python -m pip install -r community/requirements-mcp.txt
          python -B -m unittest community.test_contribution_contract community.test_public_intake community.test_review_visibility community.test_contribution_input
  catalog-free-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a catalog-free source checkout
        run: |
          expected=$(printf '%s\n' community/site/README.md community/site/frontend-revision.txt)
          actual=$(git ls-files -- community/site/)
          if [ "$actual" != "$expected" ]; then
            echo 'Only site documentation and the frontend pin belong in the source checkout:'
            printf '%s\n' "$actual"
            exit 1
          fi
          test -z "$(git ls-files -- reports/ docs/images/ '*.html' '*.css' '*.js')" || {
            echo 'Report archives and website assets belong outside the workflow checkout.'
            exit 1
          }
  clean-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -B -m scripts smoke-install
