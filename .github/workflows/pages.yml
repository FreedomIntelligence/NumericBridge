name: Publish legacy website redirects
on:
  push:
    branches: [main]
    paths: ['community/site/**', '.github/workflows/pages.yml', 'scripts/site_bundle.py']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Require a catalog-free source checkout
        run: |
          expected=$(printf '%s\n' community/site/README.md community/site/frontend-revision.txt)
          actual=$(git ls-files -- community/site/)
          if [ "$actual" != "$expected" ]; then
            echo 'Only site documentation and the frontend pin belong in the source checkout:'
            printf '%s\n' "$actual"
            exit 1
          fi
      - name: Build and verify the legacy redirect artifact
        run: |
          site="$RUNNER_TEMP/numericbridge-site"
          python -B -m scripts.site_bundle --legacy-pages --output "$site"
          expected=$(printf '%s\n' 404.html archive.html index.html paper.html rsi.html)
          test "$(LC_ALL=C ls -1A "$site")" = "$expected"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/numericbridge-site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
