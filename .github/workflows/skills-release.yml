name: Publish skills release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: skills-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require an existing version tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF" =~ ^refs/tags/skills-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Run this workflow on an existing skills-vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          echo "SKILLS_VERSION=${GITHUB_REF_NAME#skills-}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install torch==2.9.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -B -m scripts validate
      - name: Build and test the downloadable ZIP
        run: |
          python -B -m scripts.skills_release --version "$SKILLS_VERSION" --output "$RUNNER_TEMP/skills-dist"
          cd "$RUNNER_TEMP/skills-dist"
          sha256sum -c "numericbridge-skills-$SKILLS_VERSION.zip.sha256"
      - name: Publish a new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="$RUNNER_TEMP/skills-dist/numericbridge-skills-$SKILLS_VERSION.zip"
          gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" --verify-tag --latest=false \
            --title "NumericBridge Skills $SKILLS_VERSION" \
            --notes 'Download the skills ZIP and its SHA-256 checksum from Assets. The ZIP is ready to use after verification and extraction; the source archives are not standalone skill bundles.'
