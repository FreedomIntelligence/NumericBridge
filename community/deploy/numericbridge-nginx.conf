# Private staging listener. Keep this on loopback until public TLS is ready.
limit_req_zone $binary_remote_addr zone=numericbridge_intake:1m rate=15r/m;
limit_req_zone $binary_remote_addr zone=numericbridge_status:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=nb_public_intake_ip:1m rate=2r/m;
limit_req_zone $server_name zone=nb_public_intake_total:1m rate=6r/m;

server {
    listen 127.0.0.1:8788;
    server_name community.numericbridge.com;
    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;

    location = /mcp {
        if ($request_method != POST) { return 405; }
        client_max_body_size 64k;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8786;
    }

    location = /v1/submissions {
        if ($request_method != POST) { return 405; }
        limit_req zone=numericbridge_intake burst=5 nodelay;
        client_max_body_size 1280k;
        proxy_pass http://127.0.0.1:8770;
    }

    location ~ "^/v1/submissions/submission-[0-9a-f]{64}$" {
        if ($request_method != GET) { return 405; }
        limit_req zone=numericbridge_status burst=10 nodelay;
        client_max_body_size 0;
        proxy_pass http://127.0.0.1:8770;
    }

    # Include these locations only in the official HTTPS server in production.
    location = /v1/public-submissions {
        if ($request_method != POST) { return 405; }
        limit_req zone=nb_public_intake_ip burst=2 nodelay;
        limit_req zone=nb_public_intake_total burst=3 nodelay;
        client_max_body_size 1280k;
        client_body_timeout 10s;
        access_log off;
        proxy_pass http://127.0.0.1:8770;
    }

    location ~ "^/v1/public-submissions/submission-[0-9a-f]{64}$" {
        if ($request_method != GET) { return 405; }
        limit_req zone=numericbridge_status burst=3 nodelay;
        client_max_body_size 1k;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        access_log off;
        proxy_pass http://127.0.0.1:8770;
    }

    location = /healthz {
        if ($request_method !~ ^(GET|HEAD)$) { return 405; }
        proxy_pass http://127.0.0.1:8770;
    }

    location / { return 404; }
}
